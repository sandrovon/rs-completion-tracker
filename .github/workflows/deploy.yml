name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - name: Fetch Honeie RuneScape data server-side
        run: |
          mkdir -p public
          curl --fail --location --retry 2 --max-time 25 --silent --show-error \
            'https://secure.runescape.com/m=adventurers-log/api/v1/playerData/Honeie?includeSkills=true&includeQuests=true' \
            -o public/honeie-player.json || rm -f public/honeie-player.json
          if [ -f public/honeie-player.json ]; then
            node -e 'const fs=require("fs"); const p="public/honeie-player.json"; try {const d=JSON.parse(fs.readFileSync(p,"utf8")); if(!d.skills||!d.quests) throw Error("missing data"); console.log("Valid RuneScape data for "+d.name)}catch(e){console.log("RuneScape data unavailable: "+e.message); fs.rmSync(p,{force:true})}'
          fi
      - name: Import cape achievements from RuneScape Wiki
        run: python3 scripts/fetch_cape_requirements.py
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
