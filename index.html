<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1315"><title>RS Completion Tracker — 8 Capes</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0a1114;color:#eef5ef}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}main{max-width:1140px;margin:auto;padding:34px 20px 70px}header{text-align:center;margin:18px 0 38px}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:800;color:#66d5a3}h1{font-size:clamp(34px,5vw,56px);margin:9px 0 12px}h2{margin:0;font-size:clamp(24px,3vw,36px)}p{color:#a5b9b4;line-height:1.55}.muted{color:#9cb2ac;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.cape{border:1px solid #2b4440;background:linear-gradient(150deg,#1b302c,#122021);border-radius:18px;padding:22px;text-align:left;min-height:238px;display:flex;flex-direction:column;align-items:flex-start;gap:13px;color:inherit;transition:transform .15s,border-color .15s}.cape:hover,.cape:focus-visible{transform:translateY(-3px);border-color:#73dba8;outline:none}.symbol{width:58px;height:58px;display:grid;place-items:center;border-radius:15px;background:#29423c;font-size:30px}.cape strong{font-size:19px;line-height:1.25}.cape small{color:#a9bdb5}.progress{height:8px;width:100%;border-radius:20px;background:#4e3038;overflow:hidden}.fill{height:100%;background:#55d493;width:0}.cape .progress{margin-top:auto}.pagehead{display:flex;gap:18px;align-items:center;margin-bottom:24px}.back{background:#1d302d;border:1px solid #39584f;border-radius:10px;color:#eaf7ee;padding:12px 15px}.panel{border:1px solid #2b4440;background:#152325;border-radius:18px;padding:24px}.details{display:flex;align-items:flex-start;gap:17px}.details .symbol{flex-shrink:0}.details p{margin:9px 0 0}.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 10px}.summary strong{font-size:19px;color:#85e3b1}.tasks{display:grid;gap:10px;margin-top:24px}.task{display:flex;align-items:center;gap:12px;background:#203234;border:1px solid #314b47;padding:15px;border-radius:11px;line-height:1.4}.task input{width:19px;height:19px;accent-color:#5bd89c;flex-shrink:0}.task span{flex:1}.task.done span{text-decoration:line-through;color:#8ca9a1}.remove{border:0;background:transparent;color:#d2a5a5;padding:5px 9px;font-size:20px}.add{display:flex;gap:10px;margin-top:20px}.add input{flex:1;min-width:0;border:1px solid #46625a;background:#0b1718;border-radius:10px;padding:13px;color:#f1f8f3}.add button{border:0;background:#59d399;color:#0b2117;font-weight:800;border-radius:10px;padding:13px 18px}.wiki{display:inline-block;color:#8ce6b6;margin-top:22px;text-decoration:none}.wiki:hover{text-decoration:underline}.hint{border-left:3px solid #bd995d;padding-left:12px;margin-top:22px}.hidden{display:none!important}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:18px 12px 40px}.grid{gap:11px}.cape{padding:15px;min-height:220px}.cape strong{font-size:16px}.symbol{width:48px;height:48px;font-size:25px}.panel{padding:15px}.details{gap:12px}.add{flex-wrap:wrap}.add button{width:100%}}
</style></head><body><main>
<section id="home"><header><div class="eyebrow">RuneScape 3</div><h1>RS Completion Tracker</h1><p>Select a cape to view and complete its requirements.</p></header><div id="capeGrid" class="grid"></div></section>
<section id="detail" class="hidden"><div class="pagehead"><button class="back" id="back">← All 8 capes</button></div><div class="panel"><div class="details"><div class="symbol" id="detailIcon"></div><div><div class="eyebrow" id="detailCategory"></div><h2 id="detailTitle"></h2><p id="detailDescription"></p></div></div><div class="summary"><span class="muted" id="detailCount"></span><strong id="detailPercent"></strong></div><div class="progress"><div class="fill" id="detailFill"></div></div><div id="tasks" class="tasks"></div><form id="addTask" class="add"><input id="newTask" placeholder="Add a requirement…" maxlength="180" aria-label="New cape requirement"><button type="submit">Add task</button></form><a id="wiki" class="wiki" target="_blank" rel="noopener noreferrer">View cape requirements on RuneScape Wiki ↗</a><p class="muted hint">These are starter milestones, not the complete official cape requirements. Add requirements as needed and check the Wiki for the latest criteria.</p></div></section>
</main><script>
(()=>{'use strict';
const KEY='rs-completion-capes-v1',defs=[
{id:'max',name:'Max Cape',group:'Skills',desc:'Work toward the required levels across all skills.',wiki:'Max_cape',tasks:['Reach the required level in every skill','Purchase the Max Cape']},
{id:'mastermax',name:'Master Max Cape',group:'Skills',desc:'Master-level training across the full skill roster.',wiki:'Master_max_cape',tasks:['Reach level 120 (including virtual levels) in every skill','Purchase the Master Max Cape']},
{id:'quest',name:'Quest Cape',group:'Quests',desc:'Complete the current RuneScape quest list.',wiki:'Quest_Cape',tasks:['Complete every current quest','Claim the Quest Cape']},
{id:'masterquest',name:'Master Quest Cape',group:'Lore',desc:'Complete quests, miniquests and lore achievements.',wiki:'Master_quest_cape',tasks:['Complete all quests and miniquests','Complete the required lore and post-quest achievements','Claim the Master Quest Cape']},
{id:'comp',name:'Completionist Cape',group:'Completion',desc:'Major skill, quest and achievement milestones.',wiki:'Completionist_cape',tasks:['Meet the current skill requirements','Complete all quests','Complete required area tasks and other achievements','Claim the Completionist Cape']},
{id:'trim',name:'Trimmed Completionist Cape',group:'Completion',desc:'Additional challenges beyond the Completionist Cape.',wiki:'Completionist_cape_(t)',tasks:['Meet the Completionist Cape requirements','Complete all additional trimmed requirements','Claim the Trimmed Completionist Cape']},
{id:'mastercomp',name:'Master Completionist Cape',group:'Master completion',desc:'Master-level completionist challenges.',wiki:'Master_completionist_cape',tasks:['Meet the Master Max Cape requirements','Meet the Completionist Cape requirements','Complete any additional current master requirements']},
{id:'mastertrim',name:'Master Trimmed Completionist Cape',group:'Master completion',desc:'The highest tier of these eight cape goals.',wiki:'Master_trimmed_completionist_cape',tasks:['Meet the Master Completionist Cape requirements','Meet the Trimmed Completionist Cape requirements','Complete any additional current master trimmed requirements']}
];
const icons=['⚔️','🌟','📜','📖','🏆','✨','👑','💎'];const $=id=>document.getElementById(id);let data;try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{data={}}if(!data||typeof data!=='object')data={};if(!data.capes||typeof data.capes!=='object')data.capes={};for(const d of defs){if(!Array.isArray(data.capes[d.id]))data.capes[d.id]=d.tasks.map((title,i)=>({id:d.id+'-'+i,title,done:false}))}let selected=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function progress(d){const items=data.capes[d.id];const done=items.filter(t=>t.done).length;return{done,total:items.length,percent:items.length?done/items.length*100:0}}
function renderHome(){const grid=$('capeGrid');grid.replaceChildren();defs.forEach((d,i)=>{const p=progress(d),button=document.createElement('button');button.type='button';button.className='cape';const symbol=document.createElement('span');symbol.className='symbol';symbol.textContent=icons[i];const name=document.createElement('strong');name.textContent=d.name;const count=document.createElement('small');count.textContent=p.done+' / '+p.total+' tasks completed';const bar=document.createElement('div');bar.className='progress';const fill=document.createElement('div');fill.className='fill';fill.style.width=p.percent+'%';bar.append(fill);button.append(symbol,name,count,bar);button.addEventListener('click',()=>openCape(d.id));grid.append(button)})}
function openCape(id){const d=defs.find(x=>x.id===id);if(!d){showHome();return}selected=d.id;$('home').classList.add('hidden');$('detail').classList.remove('hidden');$('detailIcon').textContent=icons[defs.indexOf(d)];$('detailCategory').textContent=d.group;$('detailTitle').textContent=d.name;$('detailDescription').textContent=d.desc;$('wiki').href='https://runescape.wiki/w/'+d.wiki;renderTasks(d);if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);window.scrollTo(0,0)}
function renderTasks(d){const items=data.capes[d.id],p=progress(d);$('detailCount').textContent=p.done+' of '+p.total+' tasks completed';$('detailPercent').textContent=p.percent.toFixed(0)+'%';$('detailFill').style.width=p.percent+'%';const container=$('tasks');container.replaceChildren();for(const t of items){const row=document.createElement('label');row.className='task'+(t.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=!!t.done;check.addEventListener('change',()=>{t.done=check.checked;save();renderTasks(d)});const span=document.createElement('span');span.textContent=t.title;const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='×';remove.title='Remove task';remove.setAttribute('aria-label','Remove '+t.title);remove.addEventListener('click',e=>{e.preventDefault();data.capes[d.id]=items.filter(x=>x.id!==t.id);save();renderTasks(d)});row.append(check,span,remove);container.append(row)}}
function showHome(){selected=null;$('detail').classList.add('hidden');$('home').classList.remove('hidden');renderHome();if(location.hash)history.replaceState(null,'',location.pathname+location.search);window.scrollTo(0,0)}
$('back').addEventListener('click',showHome);$('addTask').addEventListener('submit',e=>{e.preventDefault();const input=$('newTask'),title=input.value.trim();if(!title||!selected)return;data.capes[selected].push({id:selected+'-'+Date.now()+'-'+Math.random().toString(36).slice(2),title,done:false});input.value='';save();renderTasks(defs.find(d=>d.id===selected))});window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(defs.some(d=>d.id===id))openCape(id);else showHome()});renderHome();const initial=location.hash.slice(1);if(defs.some(d=>d.id===initial))openCape(initial);
})();
</script></body></html>
